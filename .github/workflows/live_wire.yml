name: live wire (the day's filings)

# The day's NSE filings for the owner's site's wire (jobs/live_wire.py), read every five minutes.
# GitHub ran a ten-minute schedule only once in the first market day (29 Oct 2026), so each start now
# runs for nearly six hours and reads in a loop; three starts a weekday cover 08:50 IST to past
# midnight, and a start cancels the one still running. The file is published alone on the `live`
# branch as one commit replaced each time, so main's history does not grow. The wire shows the time
# it was read.

on:
  schedule:
    - cron: "20 3 * * 1-5"               # 08:50 IST
    - cron: "20 9 * * 1-5"               # 14:50 IST, through the results filed after the close
    - cron: "20 15 * * 1-5"              # 20:50 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-wire
  cancel-in-progress: true

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: pip install -r requirements-lock.txt
      - name: read the day's filings every five minutes and publish them on the live branch
        run: |
          end=$(( $(date +%s) + 345 * 60 ))
          git config --global user.name  "zen-bot"
          git config --global user.email "actions@github.com"
          while [ "$(date +%s)" -lt "$end" ]; do
            out="$RUNNER_TEMP/wire"
            rm -rf "$out" && mkdir -p "$out/live"
            if python -m jobs.live_wire --out "$out/live/filings.json"; then
              ( cd "$out" && git init -q -b live && git add live/filings.json && git commit -q -m "wire $(date -u +%Y-%m-%dT%H:%MZ)" &&
                git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" live ) || echo "publish failed, next round"
            else
              echo "NSE did not answer, next round"
            fi
            sleep 300
          done
