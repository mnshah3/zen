name: 1. daily prices

on:
  schedule:
    # 13:30 UTC = 19:00 IST, comfortably after the 15:30 IST close.
    # GitHub cron drifts 5-15 min on the free tier, which is fine here.
    - cron: "30 13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: pip install -r requirements-lock.txt

      # The DuckDB file is derived and never committed, so rebuild it first.
      - run: python -m jobs.rebuild_db

      - run: python -m jobs.update_prices --days 7

      - name: commit new data
        run: |
          git config user.name  "zen-bot"
          git config user.email "actions@github.com"
          git add data/daily data/daily_other
          git diff --staged --quiet || git commit -m "data: bhavcopy $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do            # another job may have pushed meanwhile
            git pull --rebase origin main && git push && exit 0
            sleep $((i * 15))
          done
          exit 1
