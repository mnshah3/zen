name: 1. daily prices

on:
  schedule:
    # 13:30 UTC = 19:00 IST, comfortably after the 15:30 IST close.
    # GitHub cron drifts 5-15 min on the free tier, which is fine here.
    - cron: "30 13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # The DuckDB file is derived and never committed, so rebuild it first.
      - run: python -m jobs.rebuild_db

      - run: python -m jobs.update_prices --days 7

      - name: commit new data
        run: |
          git config user.name  "zen-bot"
          git config user.email "actions@github.com"
          git add data/daily
          git diff --staged --quiet || git commit -m "data: bhavcopy $(date -u +%Y-%m-%d)"
          git push
