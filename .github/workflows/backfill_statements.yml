name: backfill statements (manual)

# One-off catch-up for data/statements: the balance sheet and cash flow statement of every
# half-year and year-end filing not yet read, standalone accounts and earlier revisions
# included (zen/data/statements.py). Started by hand. Each run reads a few thousand filings,
# newest first, commits them, and starts the next run itself while it is still making
# progress. The daily data job keeps the table current afterwards. Research data: no strategy
# reads it.
#
# reparse=true reads again the documents an older parser read (statements.PARSER_VERSION), and
# full_year=true keeps to the year-end filings, whose year to date is the audited year: that is
# how the full-year income statement (Oct 2026: owners' profit, EPS, tax and the main costs) is
# filled in for the years already stored.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Filings to read in this run"
        default: "7000"
      chain:
        description: "Start the next run when this one read something (true or false)"
        default: "true"
      reparse:
        description: "Read again what an older parser read (true or false)"
        default: "false"
      full_year:
        description: "Only the year-end filings (true or false)"
        default: "false"

permissions:
  contents: write
  actions: write

concurrency:
  group: backfill-statements
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: pip install -r requirements-lock.txt
      - run: python -m jobs.rebuild_db

      # The evening data job (started at 15:05 UTC by the Cloudflare timer) writes these same
      # files. A run that would read inside its window waits until the window is over.
      - name: wait out the evening data job
        run: |
          now=$(date -u +%H%M)
          if [ "$now" -ge 1430 ] && [ "$now" -lt 1645 ]; then
            secs=$(( $(date -u -d "16:45" +%s) - $(date -u +%s) ))
            echo "inside the evening data job's window: waiting ${secs}s"
            sleep "$secs"
          fi

      - name: read the filings
        id: read
        run: |
          flags=""
          [ "${{ inputs.reparse }}" = "true" ] && flags="$flags --reparse"
          [ "${{ inputs.full_year }}" = "true" ] && flags="$flags --full-year"
          python -m jobs.update_statements --limit "${{ inputs.limit }}" $flags --rows-out "$RUNNER_TEMP/run_rows.parquet" | tee run.log
          echo "read=$(grep -o '[0-9,]* read (' run.log | tail -1 | tr -dc '0-9')" >> "$GITHUB_OUTPUT"

      - name: commit what was read
        run: |
          git config user.name  "zen-bot"
          git config user.email "actions@github.com"
          [ ! -d data/statements ] || git add data/statements
          git diff --staged --quiet && { echo "nothing new"; exit 0; }
          git commit -q -m "data: statements backfill $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            # Another job pushed new versions of the same yearly files, which git cannot merge
            # (they are binary). Start again from GitHub's copy and merge this run's rows into it:
            # write() keeps one row a filing, the later reading winning, so nothing is lost or doubled.
            git rebase --abort 2>/dev/null || true
            git fetch -q origin main && git reset -q --hard origin/main
            [ -f "$RUNNER_TEMP/run_rows.parquet" ] || exit 1
            python -m jobs.update_statements --merge-rows "$RUNNER_TEMP/run_rows.parquet"
            git add data/statements
            git diff --staged --quiet && { echo "nothing new after the merge"; exit 0; }
            git commit -q -m "data: statements backfill $(date -u +%Y-%m-%d)"
            sleep $((i * 15))
          done
          exit 1

      # Only when this run made progress, so a run that read nothing cannot loop for ever.
      - name: start the next run
        if: ${{ inputs.chain == 'true' && steps.read.outputs.read != '0' && steps.read.outputs.read != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run backfill_statements.yml --ref main -f limit="${{ inputs.limit }}" -f chain=true -f reparse="${{ inputs.reparse }}" -f full_year="${{ inputs.full_year }}"
