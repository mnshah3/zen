name: 2. daily brief (email)

on:
  schedule:
    - cron: "30 1 * * 1-5"     # 07:00 IST
    - cron: "15 2 * * 1-5"     # 07:45 IST, a second chance: GitHub delays scheduled runs by hours at times, or drops them
  workflow_dispatch:

# One brief at a time: the second schedule waits for the first, then finds today's brief and stops
concurrency:
  group: daily-brief
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Today's brief is committed only after its email went out, so a scheduled run that finds it
      # on main has nothing to do. A manual run always builds and sends.
      - name: already sent today?
        id: sent
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f "state/briefs/$(date -u +%Y-%m-%d).json" ]; then
            echo "today's brief is already out, nothing to do"
            echo "done=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.sent.outputs.done != 'true'
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: pip install -r requirements-lock.txt
        if: steps.sent.outputs.done != 'true'
      - run: python -m jobs.rebuild_db
        if: steps.sent.outputs.done != 'true'

      - name: build and send
        if: steps.sent.outputs.done != 'true'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MARKETAUX_KEY: ${{ secrets.MARKETAUX_KEY }}
        run: python -m jobs.daily_brief

      # The filings the brief fetched are part of the archive. Until 2026-10-04
      # only the story memory was committed, so they vanished with the runner.
      - name: commit story memory and filings
        if: steps.sent.outputs.done != 'true'
        run: |
          git config user.name  "zen-bot"
          git config user.email "actions@github.com"
          git add state/seen.json data/announcements
          [ ! -d state/briefs ] || git add state/briefs
          [ ! -f state/data_freshness.json ] || git add state/data_freshness.json
          git diff --staged --quiet || git commit -m "state: brief memory $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do            # another job may have pushed meanwhile
            git pull --rebase origin main && git push && exit 0
            sleep $((i * 15))
          done
          exit 1

      # Last, so the email has already gone out: a stale source turns the run
      # red instead of hiding behind a brief that degraded quietly.
      - name: data health
        if: steps.sent.outputs.done != 'true'
        run: python -m jobs.data_health
