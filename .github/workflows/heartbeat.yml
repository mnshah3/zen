name: heartbeat

# Proves the schedule + secrets + delivery path work, with no real logic
# attached. Delete once the daily job has run cleanly for a week.

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -c "from zen.notify import telegram; telegram.send('Zen heartbeat: pipeline alive')"
