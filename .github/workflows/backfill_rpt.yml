name: backfill related parties (manual)

# One-off catch-up for data/rpt (zen/data/rpt.py): the related-party transactions in the standalone
# results of the last half years (September and March quarter ends) not yet read, fetched from NSE
# (jobs/backfill_rpt.py). Started by hand; the daily data job keeps the table current afterwards.
# Research data: no strategy reads it.

on:
  workflow_dispatch:
    inputs:
      halves:
        description: "Half years to cover, the latest first"
        default: "2"

permissions:
  contents: write

concurrency:
  group: backfill-rpt
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: pip install -r requirements-lock.txt

      # The evening data job (started at 15:05 UTC by the Cloudflare timer) writes data/rpt too.
      - name: wait out the evening data job
        run: |
          now=$(date -u +%H%M)
          if [ "$now" -ge 1430 ] && [ "$now" -lt 1645 ]; then
            secs=$(( $(date -u -d "16:45" +%s) - $(date -u +%s) ))
            echo "inside the evening data job's window: waiting ${secs}s"
            sleep "$secs"
          fi

      - name: read the filings
        run: python -m jobs.backfill_rpt --halves "${{ inputs.halves }}" --download --rate 2

      - name: commit what was read
        run: |
          git config user.name  "zen-bot"
          git config user.email "actions@github.com"
          [ ! -d data/rpt ] || git add data/rpt
          git diff --staged --quiet && { echo "nothing new"; exit 0; }
          git commit -q -m "data: related-party backfill $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            # the daily job pushed a new version of a half year's file, which git cannot merge
            # (binary): start again from GitHub's copy and read again; the filings already read
            # are skipped and the rest come from this runner's copy of the documents
            git rebase --abort 2>/dev/null || true
            git fetch -q origin main && git reset -q --hard origin/main
            python -m jobs.backfill_rpt --halves "${{ inputs.halves }}"
            git add data/rpt
            git diff --staged --quiet && { echo "nothing new after the merge"; exit 0; }
            git commit -q -m "data: related-party backfill $(date -u +%Y-%m-%d)"
            sleep $((i * 15))
          done
          exit 1
