name: backfill sustainability reports (manual)

# One-off catch-up for data/brsr (zen/data/brsr.py): each company's latest Business Responsibility and
# Sustainability Report on NSE, read for what the company does (jobs/update_brsr.py). Started by
# hand; the daily data job reads the new filings afterwards.
# Research data: no strategy reads it.

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Days of filings to list"
        default: "420"
      refill:
        description: "Read again the stored reports without group companies"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: backfill-brsr
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: pip install -r requirements-lock.txt

      # The evening data job (started at 15:05 UTC by the Cloudflare timer) writes data/brsr too.
      - name: wait out the evening data job
        run: |
          now=$(date -u +%H%M)
          if [ "$now" -ge 1430 ] && [ "$now" -lt 1645 ]; then
            secs=$(( $(date -u -d "16:45" +%s) - $(date -u +%s) ))
            echo "inside the evening data job's window: waiting ${secs}s"
            sleep "$secs"
          fi

      - name: read the filings
        run: python -m jobs.update_brsr --days "${{ inputs.days }}" --latest-only --rate 2 --minutes 150 ${{ inputs.refill && '--refill' || '' }}

      - name: commit what was read
        if: always()                     # a run stopped early keeps what it read
        run: |
          git config user.name  "zen-bot"
          git config user.email "actions@github.com"
          [ ! -d data/brsr ] || git add data/brsr
          git diff --staged --quiet && { echo "nothing new"; exit 0; }
          git commit -q -m "data: sustainability report backfill $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            # the daily job pushed a new version of a half year's file, which git cannot merge
            # (binary): start again from GitHub's copy and read again; the filings already read
            # are skipped and the rest come from this runner's copy of the documents
            git rebase --abort 2>/dev/null || true
            git fetch -q origin main && git reset -q --hard origin/main
            python -m jobs.update_brsr --days "${{ inputs.days }}" --latest-only --rate 2 ${{ inputs.refill && '--refill' || '' }}
            git add data/brsr
            git diff --staged --quiet && { echo "nothing new after the merge"; exit 0; }
            git commit -q -m "data: sustainability report backfill $(date -u +%Y-%m-%d)"
            sleep $((i * 15))
          done
          exit 1
